<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ETF True Exposure Lab</title>
    <link rel="stylesheet" href="styles.css?v=20260524-mvp5" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">ETF True Exposure Lab</p>
          <h1>10 檔 ETF 同步交叉比對</h1>
        </div>
        <div class="status-strip" aria-label="資料狀態">
          <span id="updateStatusPill" class="status-pill manual"><span></span>使用快取資料</span>
          <button id="refreshDataBtn" class="refresh-button" type="button">刷新資料</button>
          <button id="autoSyncToggleBtn" class="refresh-button" type="button">自動刷新：關</button>
          <span id="lastRefreshText" class="status-pill">最新資料日 --</span>
          <span class="status-pill">主動 / 被動 ETF</span>
        </div>
      </header>

      <section class="workspace-grid">
        <aside class="selector-panel" aria-label="ETF 選取與資金配置">
          <div class="panel-head">
            <div>
              <p class="panel-kicker">Selector Hub</p>
              <h2>ETF 組合</h2>
            </div>
            <span class="limit-counter" id="limitCounter">0 / 10</span>
          </div>

          <label class="search-box" for="etfSearch">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="etfSearch" autocomplete="off" placeholder="代號、關鍵字、產業主題" />
          </label>
          <div id="universeSummary" class="universe-summary" aria-live="polite"></div>
          <div id="searchResults" class="search-results" role="listbox"></div>
          <p id="selectorNotice" class="selector-notice" aria-live="polite"></p>

          <section class="auto-allocation-panel" aria-label="自動產業配比">
            <div class="allocation-head">
              <span>自動產生資金配比</span>
              <button id="autoAllocateBtn" class="icon-button" type="button" title="產生配比" aria-label="產生配比">◎</button>
            </div>
            <div class="target-grid">
              <label class="target-field">
                <span>板塊 1</span>
                <select id="targetSector1"></select>
                <input id="targetWeight1" type="number" min="0" max="100" step="1" value="45" aria-label="板塊 1 期望比例" />
              </label>
              <label class="target-field">
                <span>板塊 2</span>
                <select id="targetSector2"></select>
                <input id="targetWeight2" type="number" min="0" max="100" step="1" value="35" aria-label="板塊 2 期望比例" />
              </label>
              <label class="target-field">
                <span>板塊 3</span>
                <select id="targetSector3"></select>
                <input id="targetWeight3" type="number" min="0" max="100" step="1" value="20" aria-label="板塊 3 期望比例" />
              </label>
            </div>
            <p id="autoAllocationNotice" class="selector-notice" aria-live="polite"></p>
          </section>

          <div class="allocation-head">
            <span>資金配比</span>
            <button id="equalizeBtn" class="icon-button" type="button" title="平均配比" aria-label="平均配比">↔</button>
          </div>
          <div id="selectedEtfs" class="selected-list"></div>

          <div class="allocation-meter" aria-label="資金配置總和">
            <div class="meter-row">
              <span>總配置</span>
              <strong id="allocationTotal">100%</strong>
            </div>
            <div class="meter-track">
              <div id="allocationBar" class="meter-fill"></div>
            </div>
          </div>

          <section class="portfolio-manager" aria-label="儲存投資組合">
            <div class="allocation-head">
              <span>儲存組合</span>
              <button id="savePortfolioBtn" class="icon-button" type="button" title="儲存組合" aria-label="儲存組合">存</button>
            </div>
            <div class="portfolio-grid">
              <label class="portfolio-field">
                <span>名稱</span>
                <input id="portfolioNameInput" maxlength="60" placeholder="例如：半導體 + 金融" />
              </label>
              <label class="portfolio-field">
                <span>已儲存</span>
                <select id="portfolioSelect"></select>
              </label>
            </div>
            <div class="portfolio-actions">
              <button id="loadPortfolioBtn" class="refresh-button small" type="button">載入</button>
              <button id="deletePortfolioBtn" class="refresh-button small danger" type="button">刪除</button>
            </div>
            <p id="portfolioNotice" class="selector-notice" aria-live="polite"></p>
          </section>

          <section class="watchlist-manager" aria-label="追蹤清單">
            <div class="allocation-head">
              <span>追蹤清單</span>
              <button id="refreshWatchStatusBtn" class="icon-button" type="button" title="刷新狀態" aria-label="刷新狀態">⟳</button>
            </div>
            <div class="watchlist-grid">
              <label class="portfolio-field">
                <span>ETF</span>
                <select id="watchlistEtfSelect"></select>
              </label>
              <label class="portfolio-field">
                <span>註記</span>
                <input id="watchlistNoteInput" maxlength="120" placeholder="例如：等待突破前高" />
              </label>
            </div>
            <div class="portfolio-actions">
              <button id="addWatchlistBtn" class="refresh-button small" type="button">加入追蹤</button>
            </div>
            <div id="watchlistList" class="watchlist-list"></div>
            <p id="watchlistNotice" class="selector-notice" aria-live="polite"></p>
          </section>
        </aside>

        <section class="main-grid" aria-label="分析結果">
          <section class="metric-row" aria-label="摘要指標">
            <article class="metric-card">
              <span>合併持股</span>
              <strong id="holdingCount">0</strong>
            </article>
            <article class="metric-card">
              <span>最高單股曝險</span>
              <strong id="topExposure">0%</strong>
            </article>
            <article class="metric-card">
              <span>主要產業</span>
              <strong id="topSector">-</strong>
            </article>
            <article class="metric-card">
              <span>共同持股</span>
              <strong id="overlapCount">0</strong>
            </article>
          </section>

          <section class="analysis-layout">
            <article class="panel exposure-panel">
              <div class="panel-head compact">
                <div>
                  <p class="panel-kicker">True Exposure Matrix</p>
                  <h2>真實權值透視</h2>
                </div>
                <div class="panel-actions">
                  <span id="riskBadge" class="risk-badge">分散正常</span>
                  <button id="exportExposureCsvBtn" class="icon-button" type="button" title="匯出 CSV" aria-label="匯出 CSV">匯</button>
                  <button id="exportExposurePdfBtn" class="icon-button" type="button" title="匯出 PDF" aria-label="匯出 PDF">PDF</button>
                </div>
              </div>
              <div id="exposureChart" class="bar-chart" aria-label="合併權重前十名"></div>
            </article>

            <article class="panel sector-panel">
              <div class="panel-head compact">
                <div>
                  <p class="panel-kicker">Sector X-Ray</p>
                  <h2>產業板塊</h2>
                </div>
                <div class="view-toggle" role="group" aria-label="產業圖表切換">
                  <button class="toggle-btn active" data-sector-view="treemap" type="button">矩形</button>
                  <button class="toggle-btn" data-sector-view="donut" type="button">圓環</button>
                </div>
              </div>
              <div id="sectorViz" class="sector-viz treemap" aria-label="合併產業配置"></div>
              <div id="sectorDetail" class="sector-detail" aria-live="polite"></div>
            </article>
          </section>

          <section class="panel heatmap-panel">
            <div class="panel-head compact">
              <div>
                <p class="panel-kicker">Overlap Heatmap</p>
                <h2>持股交集熱力圖</h2>
              </div>
              <label class="slider-field" for="overlapSlider">
                <span>至少 <strong id="overlapValue">2</strong> 檔</span>
                <input id="overlapSlider" type="range" min="1" max="10" value="2" />
              </label>
            </div>
            <div id="heatmap" class="heatmap" aria-label="ETF 持股交集"></div>
          </section>

          <section class="panel history-panel">
            <div class="panel-head compact">
              <div>
                <p class="panel-kicker">Holding Change</p>
                <h2>每日持股變化</h2>
              </div>
              <label class="select-field" for="historyEtfSelect">
                <span>ETF</span>
                <select id="historyEtfSelect"></select>
              </label>
            </div>
            <div id="historySummary" class="history-summary"></div>
            <div id="historyChart" class="history-chart" aria-label="近月持股調整幅度"></div>
            <div id="historyTable" class="history-table" aria-label="近月每日持股變化"></div>
          </section>

          <section class="panel quality-panel">
            <div class="panel-head compact">
              <div>
                <p class="panel-kicker">Data Quality</p>
                <h2>資料品質</h2>
              </div>
            </div>
            <div id="qualityPanel" class="quality-grid" aria-label="目前資料品質"></div>
          </section>
        </section>
      </section>
    </main>

    <script src="app.js?v=20260524-mvp5"></script>
  </body>
</html>
